spring:
  application:
    name: msa5-spring
  web:
    error:
      include-stacktrace: never
      include-message: never
      # 에러 낫을 때 상세 정보를 언제나 보겠다
logging:
  file:
    name: logs/error.log
  level:
    # error > warn > info > debug > trace
    root: warn
    org.msa.msa5spring: debug
debug: false